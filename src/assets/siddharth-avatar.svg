<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00040f" />
      <stop offset="100%" stop-color="#11101d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82E8EB" />
      <stop offset="100%" stop-color="#00f6ff" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="120" cy="120" r="115" fill="url(#avatarGrad)" stroke="url(#accentGrad)" stroke-width="4" />

  <!-- Developer Silhouette / Monogram Art -->
  <circle cx="120" cy="85" r="40" fill="#1c2035" stroke="#82E8EB" stroke-width="2" />
  <path d="M 50 195 C 50 145 90 135 120 135 C 150 135 190 145 190 195 Z" fill="#1c2035" stroke="#82E8EB" stroke-width="2" />

  <!-- Code brackets graphic on chest -->
  <text x="120" y="175" font-family="'Poppins', monospace" font-size="22" font-weight="bold" fill="url(#accentGrad)" text-anchor="middle">&lt;SS /&gt;</text>
</svg>